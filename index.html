<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F8A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="만원주택">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>화순군 만원 임대주택 · 시연</title>
<style>:root {
  --green: #1F8A5B;
  --green-dark: #17704A;
  --green-soft: #EAF6EF;
  --orange: #F2711C;
  --orange-soft: #FFF1E6;
  --red: #D93636;
  --ink: #1B1F24;
  --ink-2: #4B5563;
  --ink-3: #8A94A3;
  --line: #E6E9ED;
  --bg: #F5F6F8;
  --navy: #14213D;
  --radius: 16px;
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #E3E7EC; color: var(--ink); }
button { font: inherit; cursor: pointer; }
input, textarea { font: inherit; }

.ctl { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 24px; background: var(--navy); color: #fff; }
.ctl-title { font-weight: 800; font-size: 17px; }
.ctl-title span { font-weight: 500; font-size: 13px; opacity: .7; margin-left: 6px; }
.ctl-roles { display: flex; gap: 6px; background: rgba(255,255,255,.1); padding: 4px; border-radius: 10px; }
.ctl-roles button { border: 0; background: transparent; color: #fff; padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; }
.ctl-roles button.on { background: #fff; color: var(--navy); }
.ctl-date { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.ctl-date b { min-width: 120px; text-align: center; }
.ctl-date button, .ctl-reset { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 8px; padding: 5px 10px; font-size: 13px; }
.ctl-reset { margin-left: auto; }

.stage { display: flex; justify-content: center; padding: 24px 16px 48px; }
.phone { position: relative; width: 390px; height: 844px; background: #fff; border-radius: 36px; box-shadow: 0 20px 60px rgba(20,33,61,.25); overflow: hidden; display: flex; flex-direction: column; }
.statusbar { display: flex; justify-content: space-between; padding: 12px 26px 6px; font-size: 14px; font-weight: 700; }
.sb-icons { letter-spacing: 2px; font-size: 11px; }
.demo-strip { background: #EEF0F3; color: var(--ink-3); text-align: center; font-size: 12px; padding: 4px 0; }
.screen { flex: 1; overflow-y: auto; padding: 18px 22px 28px; }
.tabs { display: flex; border-top: 1px solid var(--line); background: #fff; }
.tabs button { flex: 1; border: 0; background: none; padding: 10px 0 16px; font-size: 12px; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs button .ic { font-size: 20px; line-height: 1; }
.tabs button.on { color: var(--green); font-weight: 700; }

.toast { position: absolute; left: 50%; bottom: 84px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: .95; transform: translate(-50%, 0); }

.top { display: flex; align-items: center; gap: 8px; color: var(--green); font-weight: 700; font-size: 15px; margin-bottom: 14px; }
.top button { border: 0; background: none; color: var(--green); font-size: 22px; padding: 0 6px 0 0; line-height: 1; }
.badge-role { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--green); color: var(--green); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
h1 { font-size: 30px; font-weight: 800; line-height: 1.3; margin: 4px 0 18px; letter-spacing: -0.6px; }
h2 { font-size: 18px; margin: 22px 0 10px; }
.sub { color: var(--ink-2); font-size: 15px; margin: -8px 0 16px; }
.muted { color: var(--ink-3); font-size: 13px; }

.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.card.soft { background: var(--green-soft); border-color: transparent; }
.card.warn { background: var(--orange-soft); border-color: transparent; }
.card.gray { background: var(--bg); border-color: transparent; }
.card h3 { margin: 0 0 6px; font-size: 17px; }

.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.hero h1 { margin-bottom: 8px; }
.hero .art { font-size: 64px; line-height: 1; }

.split { display: flex; text-align: center; }
.split > div { flex: 1; }
.split > div + div { border-left: 1px solid rgba(31,138,91,.25); }
.big { font-size: 36px; font-weight: 800; color: var(--green); }
.pill { display: inline-block; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
.pill.orange { background: #FFE0CC; color: var(--orange); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.gray { background: var(--bg); color: var(--ink-2); }
.pill.red { background: #FDE2E2; color: var(--red); }

.btn { display: block; width: 100%; border: 0; border-radius: 14px; background: var(--green); color: #fff; font-weight: 700; font-size: 17px; padding: 15px; margin-top: 14px; }
.btn:hover { background: var(--green-dark); }
.btn.ghost { background: #fff; color: var(--green); border: 1px solid var(--green); }
.btn.orange { background: var(--orange); }
.btn:disabled { background: #C9CED6; cursor: default; }

.q { margin-bottom: 14px; }
.q label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.opts { display: flex; gap: 8px; }
.opts button { flex: 1; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 6px; font-weight: 600; color: var(--ink-2); }
.opts button.on { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.opts button.on::before { content: '✓ '; }

.result { display: flex; gap: 12px; align-items: center; }
.result .mark { width: 42px; height: 42px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 22px; flex: none; }
.result.no .mark { background: var(--red); }
.result b { font-size: 18px; display: block; }

.steps { display: flex; justify-content: space-between; position: relative; margin: 6px 4px 18px; }
.steps::before { content: ''; position: absolute; top: 17px; left: 18px; right: 18px; height: 3px; background: var(--line); }
.steps .s { position: relative; text-align: center; font-size: 13px; color: var(--ink-3); width: 60px; }
.steps .dot { width: 36px; height: 36px; border-radius: 50%; background: #EEF0F3; color: var(--ink-3); display: grid; place-items: center; margin: 0 auto 4px; font-weight: 800; }
.steps .s.done .dot { background: var(--green); color: #fff; }
.steps .s.now .dot { background: #fff; border: 3px solid var(--green); color: var(--green); }
.steps .s.now, .steps .s.done { color: var(--green); font-weight: 700; }

.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .ttl { font-weight: 700; }
.row .ic { width: 28px; text-align: center; font-size: 20px; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--bg); }
.chev { color: var(--ink-3); }

.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #C9CED6; display: grid; place-items: center; flex: none; color: #fff; font-size: 14px; }
.check.on { background: var(--green); border-color: var(--green); }
.check.warn { background: var(--orange); border-color: var(--orange); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.chips button.chip.on { background: var(--green); color: #fff; border-color: var(--green); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { border-radius: var(--radius); padding: 14px; background: var(--bg); cursor: pointer; border: 0; text-align: left; }
.stat.soft { background: var(--green-soft); }
.stat.warn { background: var(--orange-soft); }
.stat .k { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.stat .v { font-size: 34px; font-weight: 800; margin-top: 4px; }
.stat.soft .v { color: var(--green); }
.stat.warn .v, .stat.warn .k { color: var(--orange); }

.photo { border: 2px dashed #C9CED6; border-radius: var(--radius); height: 150px; display: grid; place-items: center; color: var(--ink-3); background: var(--bg); cursor: pointer; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); resize: none; }
.timeline { padding-left: 6px; }
.timeline .t { display: flex; gap: 10px; align-items: center; padding: 6px 0; color: var(--ink-3); }
.timeline .t.done, .timeline .t.now { color: var(--ink); }
.timeline .t.now { font-weight: 700; color: var(--green); }
.preview { background: var(--orange-soft); color: var(--orange); border-radius: 12px; padding: 14px; font-weight: 700; font-size: 16px; }
.note { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.center { text-align: center; }
.empty { text-align: center; color: var(--ink-3); padding: 40px 0; }
.celebrate { font-size: 72px; text-align: center; margin: 4px 0; }

.hero-bg { margin: -18px -22px 16px; padding: 18px 22px 0; min-height: 268px; background: #F3F1E7 url(hero.jpg) center bottom / cover no-repeat; }
.hero-bg h1 { margin-bottom: 6px; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
.hero-bg .sub { margin: 0; }
.join-hero { min-height: 250px; }
.hello { display: inline-block; background: rgba(255,255,255,.85); color: var(--green); font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px; margin-bottom: 4px; }
.field { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; background: var(--bg); }
.field:focus { outline: none; border-color: var(--green); background: #fff; }
.big-field { font-size: 32px; letter-spacing: 12px; text-align: center; font-weight: 800; }
.modebar { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.modebar:empty { display: none; }
.modebar .who { font-weight: 800; color: var(--green); }
.seg { display: flex; background: var(--bg); border-radius: 8px; padding: 2px; margin-left: auto; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: #fff; color: var(--green); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.mini { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 8px; font-size: 12px; color: var(--ink-2); }
.net { font-size: 12px; font-weight: 700; }
.net.ok { color: #2BB673; }
.net.bad { color: var(--orange); }
.ctl-extra { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.ctl-extra .ctl-reset { margin-left: 0; }
.code-chip { background: #fff; color: var(--navy); border-radius: 8px; padding: 4px 10px; font-weight: 800; font-size: 14px; }
.join-card { display: flex; gap: 14px; align-items: center; }
.join-card img { background: #fff; border-radius: 10px; padding: 4px; flex: none; }
.join-card .code { font-size: 18px; margin: 2px 0; }
.join-card .code b { font-size: 26px; letter-spacing: 3px; color: var(--green); }
body[data-mode="class"] .ctl, body[data-mode="none"] .ctl-roles, body[data-mode="none"] .ctl-date { display: none; }
body[data-mode="solo"] .modebar .seg { margin-left: auto; }

@media (min-width: 521px) {
  body[data-mode="solo"] .modebar, body[data-mode="admin"] .modebar { display: none; }
}
@media (max-width: 520px) {
  body { background: #fff; }
  .ctl { display: none; }
  .stage { padding: 0; }
  .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; padding-top: env(safe-area-inset-top); }
  .statusbar { display: none; }
  .tabs button { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
}
.join-hero .sub { max-width: 58%; font-size: 14px; }
</style>
</head>
<body data-mode="none">
<header class="ctl" data-testid="control-bar">
  <div class="ctl-title">화순군 만원 임대주택 <span>시연용 가상 앱</span></div>
  <div class="ctl-roles" id="roles"></div>
  <div class="ctl-date" id="date"></div>
  <div class="ctl-extra" id="ctl-extra"></div>
</header>
<main class="stage">
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span class="sb-icons">▂▄▆ ◔ ▮</span></div>
    <div class="demo-strip">시연용 가상 화면</div>
    <div class="modebar" id="modebar"></div>
    <div class="screen" id="screen" data-testid="screen"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="toast" id="toast" role="status"></div>
  </div>
</main>
<script>const Store = (() => {
  const START_DAY = '2026-11-12';
  const APPLY_DEADLINE = '2026-11-24';
  const SEED = 20261102;
  const FIX_DAYS = 8;
  const REGISTER_DAYS = 14;
  const SOON_DAYS = 5;
  const SLOTS = { youth: 50, newlywed: 50 };
  const WAITLIST = 20;
  const MAIN_UNIT = '가상주택 101동 203호';
  const DOC_LABEL = { application: '신청서', consent: '개인정보 동의서', resident: '주민등록등본' };
  const DEFAULT_SCREEN = { applicant: 'home', resident: 'guide', admin: 'dashboard' };
  const REPAIR_FLOW = ['received', 'checked', 'scheduled', 'done'];

  function prng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(list, rand) {
    const out = list.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  function toDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return Date.UTC(y, m - 1, d);
  }

  function fromDate(ms) {
    return new Date(ms).toISOString().slice(0, 10);
  }

  function addDays(s, n) {
    return fromDate(toDate(s) + n * 86400000);
  }

  function daysBetween(from, to) {
    return Math.round((toDate(to) - toDate(from)) / 86400000);
  }

  function monthDay(s) {
    const [, m, d] = s.split('-').map(Number);
    return `${m}월 ${d}일`;
  }

  const pad = (n, w) => String(n).padStart(w, '0');

  function fixMessage(doc, due) {
    return `${DOC_LABEL[doc]}을 ${monthDay(due)}까지 올려 주세요`;
  }

  function seed() {
    const rand = prng(SEED);
    const today = START_DAY;
    const applicants = [{
      id: 'A001', name: '가상 001', type: 'youth', status: 'none',
      docs: { application: false, consent: false, resident: false },
      fixDue: null, fixMsg: null, waitNo: null, unit: null,
      contractDone: false, moveInDate: null, registered: false, appliedAt: null,
    }];
    const types = shuffle([...Array(436).fill('youth'), ...Array(53).fill('newlywed')], rand);
    types.forEach((type, i) => {
      const n = i + 2;
      let status = 'verified';
      if (i < 37) status = 'needs_fix';
      else if (i < 157) status = 'submitted';
      const fixDoc = ['resident', 'consent', 'application'][i % 3];
      const docs = { application: true, consent: true, resident: true };
      let fixDue = null;
      let fixMsg = null;
      if (status === 'needs_fix') {
        docs[fixDoc] = false;
        fixDue = addDays(today, 1 + (i % FIX_DAYS));
        fixMsg = fixMessage(fixDoc, fixDue);
      }
      applicants.push({
        id: `A${pad(n, 3)}`, name: `가상 ${pad(n, 3)}`, type, status, docs, fixDue, fixMsg,
        waitNo: null, unit: null, contractDone: false, moveInDate: null, registered: false,
        appliedAt: addDays(today, -1 - Math.floor(rand() * 20)),
      });
    });

    const residents = [];
    for (let i = 0; i < 40; i++) {
      const soon = i < 6;
      residents.push({
        id: `R${pad(i + 1, 2)}`, name: `가상 입주 ${pad(i + 1, 2)}`,
        unit: `가상주택 ${102 + Math.floor(i / 10)}동 ${301 + (i % 10)}호`,
        moveInDate: soon ? addDays(today, -REGISTER_DAYS + i) : addDays(today, -30 - i),
        registered: !soon,
      });
    }

    const kinds = ['보일러', '누수', '도배', '기타'];
    const descs = ['따뜻한 물이 안 나와요', '욕실 천장에서 물이 새요', '벽지가 들떴어요', '현관문 도어록이 안 열려요'];
    const repairs = [];
    for (let i = 0; i < 10; i++) {
      const r = residents[10 + i];
      repairs.push({
        id: `F${pad(i + 1, 3)}`, ownerId: r.id, unit: r.unit, kind: kinds[i % 4], desc: descs[i % 4], photo: null,
        status: i < 4 ? REPAIR_FLOW[i % 3] : 'done',
        visit: i % 3 === 2 || i >= 4 ? `${monthDay(addDays(today, i < 4 ? 2 : -3 - i))} 오후` : null,
        createdAt: addDays(today, -1 - i),
      });
    }

    return { today, role: 'applicant', screen: 'home', meId: 'A001', applicants, residents, repairs, lotteryDone: false };
  }

  function registerDue(person) {
    return person.moveInDate ? addDays(person.moveInDate, REGISTER_DAYS) : null;
  }

  function registerList(st) {
    const people = [
      ...st.residents,
      ...st.applicants.filter((a) => a.status === 'won' && a.moveInDate),
    ];
    return people
      .filter((p) => !p.registered)
      .map((p) => ({ id: p.id, name: p.name, unit: p.unit, due: registerDue(p), left: daysBetween(st.today, registerDue(p)) }))
      .sort((a, b) => a.left - b.left);
  }

  function counts(st) {
    return {
      applied: st.applicants.filter((a) => a.status !== 'none').length,
      needsFix: st.applicants.filter((a) => a.status === 'needs_fix').length,
      deadlineSoon: registerList(st).filter((p) => p.left <= SOON_DAYS).length,
      repairsOpen: st.repairs.filter((r) => r.status !== 'done').length,
    };
  }

  function checkEligibility({ age, household, region }) {
    if (household !== 'newlywed' && age !== '19-39') {
      return { ok: false, reason: '청년 신청은 만 19~39세만 할 수 있어요', note: '' };
    }
    const note = region === 'outside'
      ? '당첨되면 입주 후 14일 안에 화순군으로 전입신고를 해야 해요'
      : '지금 화순군에 살고 있어도 신청할 수 있어요';
    return { ok: true, reason: household === 'newlywed' ? '신혼부부 조건에 맞아요' : '청년 나이 조건에 맞아요', note };
  }

  function updateMe(st, fn) {
    const me = st.applicants.find((a) => a.id === st.meId);
    fn(me);
  }

  function runLottery(st) {
    if (st.lotteryDone) return;
    const rand = prng(SEED + 7);
    const me = st.applicants.find((a) => a.id === st.meId);
    ['youth', 'newlywed'].forEach((type) => {
      const pool = shuffle(st.applicants.filter((a) => a.type === type && a.status === 'verified' && a.id !== st.meId), rand);
      let slots = SLOTS[type];
      let unitNo = 0;
      if (me.status === 'verified' && me.type === type) {
        me.status = 'won';
        me.unit = MAIN_UNIT;
        slots -= 1;
      }
      pool.forEach((a, i) => {
        if (i < slots) {
          a.status = 'won';
          unitNo += 1;
          const base = type === 'youth' ? 101 : 106;
          a.unit = `가상주택 ${base + Math.floor(unitNo / 12)}동 ${204 + (unitNo % 12)}호`;
        } else if (i < slots + WAITLIST) {
          a.status = 'waitlist';
          a.waitNo = i - slots + 1;
        } else {
          a.status = 'lost';
        }
      });
    });
    st.lotteryDone = true;
  }

  function reduce(state, action) {
    if (action.type === 'reset') return seed();
    const st = structuredClone(state);
    switch (action.type) {
      case 'go': st.screen = action.screen; break;
      case 'setRole': st.role = action.role; st.screen = DEFAULT_SCREEN[action.role]; break;
      case 'setToday': st.today = action.date; break;
      case 'shiftDay': st.today = addDays(st.today, action.n); break;
      case 'submitApplication':
        updateMe(st, (me) => { me.docs = { ...action.docs }; me.status = 'submitted'; me.appliedAt = st.today; if (action.applicantType) me.type = action.applicantType; });
        break;
      case 'requestFix': {
        const a = st.applicants.find((x) => x.id === action.id);
        a.status = 'needs_fix';
        a.docs[action.doc] = false;
        a.fixDue = addDays(st.today, FIX_DAYS);
        a.fixMsg = fixMessage(action.doc, a.fixDue);
        break;
      }
      case 'resubmit':
        updateMe(st, (me) => { me.docs[action.doc] = true; me.status = 'submitted'; me.fixDue = null; me.fixMsg = null; });
        break;
      case 'verify': {
        const a = st.applicants.find((x) => x.id === action.id);
        if (Object.values(a.docs).every(Boolean)) a.status = 'verified';
        break;
      }
      case 'runLottery': runLottery(st); break;
      case 'signContract': updateMe(st, (me) => { if (me.status === 'won') me.contractDone = true; }); break;
      case 'moveIn': updateMe(st, (me) => { if (me.contractDone) me.moveInDate = st.today; }); break;
      case 'registerAddress': updateMe(st, (me) => { if (me.moveInDate) me.registered = true; }); break;
      case 'submitRepair': {
        const me = st.applicants.find((a) => a.id === st.meId);
        if (!me.moveInDate) break;
        st.repairs.unshift({
          id: `F${pad(st.repairs.length + 1, 3)}`, ownerId: me.id, unit: me.unit, kind: action.kind, desc: action.desc,
          photo: action.photo || null, status: 'received', visit: null, createdAt: st.today,
        });
        break;
      }
      case 'repairNext': {
        const r = st.repairs.find((x) => x.id === action.id);
        const next = REPAIR_FLOW[REPAIR_FLOW.indexOf(r.status) + 1];
        if (next) {
          r.status = next;
          if (next === 'scheduled') r.visit = `${monthDay(addDays(st.today, 2))} 오후`;
        }
        break;
      }
      default: throw new Error(`알 수 없는 동작: ${action.type}`);
    }
    return st;
  }

  return {
    seed, reduce, counts, registerList, checkEligibility, registerDue,
    addDays, daysBetween, monthDay, fixMessage, DOC_LABEL, SOON_DAYS, REPAIR_FLOW, FIX_DAYS, APPLY_DEADLINE,
  };
})();

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT);
    try {
      const res = await fetch(`${URL}/rest/v1/rpc/${name}`, {
        method: 'POST', signal: ctrl.signal,
        headers: { apikey: KEY, 'Content-Type': 'application/json' },

      const err = new Error(known || '처리하지 못했어요. 잠시 뒤 다시 해 주세요');
      err.code = msg;

    return `${m}월 ${d}일 (${WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]})`;
  }

  function renderControl(st) {
    const mode = session.mode;
    document.body.dataset.mode = mode;
    const roles = mode === 'solo' ? ROLES : mode === 'admin' ? [['admin', '담당 공무원']] : [];
    $('roles').innerHTML = roles.map(([r, label]) => `<button class="${st.role === r ? 'on' : ''}" data-action="setRole" data-role="${r}" data-testid="role-${r}">${label}</button>`).join('');
    const canShift = mode === 'solo' || mode === 'admin';
    $('date').innerHTML = mode === 'none' ? '' : `<span>시연 날짜</span>${canShift ? '<button data-action="shift" data-n="-1" data-testid="day-prev">‹ 하루</button>' : ''}<b data-testid="today">${dateLabel(st.today)}</b>${canShift ? '<button data-action="shift" data-n="1" data-testid="day-next">하루 ›</button><button data-action="shift" data-n="7" data-testid="day-week">+7일</button>' : ''}`;
    const net = connected() ? `<span class="net ${online ? 'ok' : 'bad'}" data-testid="net">${online ? '● 연결됨' : '● 재연결 중'}</span>` : '';
    const codeChip = mode === 'admin' ? `<span class="code-chip">반 ${session.code}</span>` : '';
    $('ctl-extra').innerHTML = mode === 'none' ? '' : `${net}${codeChip}<button class="ctl-reset" data-action="reset" data-testid="reset">처음 상태로</button><button class="ctl-reset" data-action="leave" data-testid="leave">나가기</button>`;
    const me = st.applicants.find((a) => a.id === st.meId);
    const seg = (r, label) => `<button class="${st.role === r ? 'on' : ''}" data-action="setRole" data-role="${r}" data-testid="seg-${r}">${label}</button>`;
    if (mode === 'class') {
      $('modebar').innerHTML = `<span class="who" data-testid="who">${me ? me.name : ''}</span><div class="seg">${seg('applicant', '신청')}${seg('resident', '입주')}</div><span class="net ${online ? 'ok' : 'bad'}">${online ? '●' : '○ 재연결 중'}</span><button class="mini" data-action="leave" data-testid="leave-mobile">나가기</button>`;
    } else if (mode === 'solo') {
      $('modebar').innerHTML = `<span class="who">혼자 체험</span><div class="seg">${seg('applicant', '신청')}${seg('resident', '입주')}${seg('admin', '담당')}</div><button class="mini" data-action="leave">나가기</button>`;
    } else {
      $('modebar').innerHTML = '';
    }
  }

  function render() {
    if (session.mode !== 'none') normalizeRole();
    const st = view();
    ui.mode = session.mode;
    ui.code = session.code;
    renderControl(st);
    if (connected() && !remote) {
      $('screen').innerHTML = `<div class="empty" data-testid="loading">${online ? '반 상태를 불러오는 중이에요…' : '연결을 기다리는 중이에요. 잠시 뒤 다시 시도해요.'}</div>`;
      $('tabs').innerHTML = '';
      return;
    }
    $('screen').innerHTML = Views.screen(st, ui);
    $('tabs').innerHTML = st.screen === 'join' ? '' : Views.tabs(st);
  }

  function apply(action) {
    local = Store.reduce(local, action);
    persist();
  }

  function go(screen) {
    apply({ type: 'go', screen });
    render();
    $('screen').scrollTop = 0;
  }

  async function rejoin(myGen, code) {
    const token = Net.newToken();
    await Net.rpc('hwasun_join', { p_code: code, p_token: token });
    if (myGen !== gen) return;
    session = { mode: 'class', code, token };
    local = { ...Store.seed(), role: 'applicant', screen: 'home' };
    ui = freshUi();
    persist();
    toast('강사가 처음 상태로 되돌렸어요');
    const fresh = await Net.rpc('hwasun_state_me', { p_token: token });
    if (myGen === gen && Net.validState(fresh, 'class')) remote = fresh;
  }

  function resetPolling() {
    pending = false;
    failCount = 0;
    nextPollAt = 0;
  }

  function leave() {
    gen += 1;
    resetPolling();
    session = { mode: 'none' };
    remote = null;
    lastRemoteKey = '';
    pin = null;
    local = { ...Store.seed(), screen: 'join' };
    ui = freshUi();
    persist();
    render();
  }

  async function refresh() {
    if (!connected()) return;
    if (inflight) { pending = true; return; }
    inflight = true;
    const myGen = gen;
    const snap = { ...session };
    let changed = false;
    try {
      const fresh = snap.mode === 'class'
        ? await Net.rpc('hwasun_state_me', { p_token: snap.token })
        : await Net.rpc('hwasun_state_admin', { p_code: snap.code, p_pin: pin });
      if (myGen !== gen) return;
      if (!Net.validState(fresh, snap.mode)) throw Object.assign(new Error('상태 형식 오류'), { code: 'bad state' });
      const key = JSON.stringify(fresh);
      changed = key !== lastRemoteKey || !online;
      lastRemoteKey = key;
      remote = fresh;
      if (snap.mode === 'admin' && remote.lotteryDone && !local.lotteryDone) apply({ type: 'runLottery' });
      if (snap.mode === 'admin' && !remote.lotteryDone && local.lotteryDone) { local = { ...Store.seed(), role: 'admin', screen: local.screen }; persist(); }
      online = true;
      failCount = 0;
      nextPollAt = 0;
    } catch (e) {
      if (myGen !== gen) return;
      if (e.code === 'unknown participant' && snap.mode === 'class') {
        try { await rejoin(myGen, snap.code); online = true; changed = true; } catch (err) { online = false; }
      } else if (e.code === 'wrong pin' || e.code === 'locked' || e.code === 'unknown class') {
        toast(e.message);
        leave();
        return;
      } else {
        changed = online || !remote;
        online = false;
        failCount += 1;
        nextPollAt = Date.now() + Math.min(30000, POLL_MS * 2 ** failCount);
      }
    } finally {
      inflight = false;
      if (pending) { pending = false; setTimeout(refresh, 0); }
    }
    if (myGen === gen && connected() && changed) render();
  }

  async function run(fn, msg) {
    const myGen = gen;
    try {
      await fn();
      if (myGen !== gen) return false;
      if (msg) toast(msg);
      lastRemoteKey = '';
      await refresh();
      return myGen === gen;
    } catch (e) {
      if (myGen !== gen) return false;
      toast(e.offline ? '연결이 불안정해요. 잠시 뒤 다시 눌러 주세요' : e.message);
      render();
      return false;
    }
  }

  const rid = (id) => Number(String(id).slice(1));
  const asMe = (name, extra = {}) => {
    if (session.mode !== 'class' || !session.token) return Promise.reject(Object.assign(new Error('수강생으로 입장해 주세요'), { code: 'not participant' }));
    return Net.rpc(name, { p_token: session.token, ...extra });
  };
  const asAdmin = (name, extra = {}) => {
    if (session.mode !== 'admin' || !pin) return Promise.reject(Object.assign(new Error('담당자만 할 수 있어요'), { code: 'not admin' }));
    return Net.rpc(name, { p_code: session.code, p_pin: pin, ...extra });
  };

  async function startClass(code) {
    ui.busy = true; ui.joinError = ''; render();
    const token = Net.newToken();
    const myGen = ++gen;
    pin = null;
    resetPolling();
    try {
      await Net.rpc('hwasun_join', { p_code: code, p_token: token });
      if (myGen !== gen) return;
      session = { mode: 'class', code, token };
      remote = null;
      lastRemoteKey = '';
      local = { ...Store.seed(), role: 'applicant', screen: 'home' };
      ui = freshUi();
      persist();
      await refresh();
      toast('입장했어요');
    } catch (e) {
      if (myGen !== gen) return;
      ui.busy = false;
      ui.joinError = e.offline ? "인터넷에 연결할 수 없어요. '혼자 체험하기'로 해 보세요" : e.message;
      render();
    }
  }

  async function startAdmin(code, value) {
    ui.busy = true; ui.joinError = ''; render();
    const myGen = ++gen;
    resetPolling();
    try {
      const ok = await Net.rpc('hwasun_admin_check', { p_code: code, p_pin: value });
      if (myGen !== gen) return;
      if (!ok) throw new Error('PIN이 맞지 않아요');
      session = { mode: 'admin', code };
      pin = value;
      remote = null;
      lastRemoteKey = '';
      local = { ...Store.seed(), role: 'admin', screen: 'dashboard' };
      ui = freshUi();
      persist();
      await refresh();
    } catch (e) {
      if (myGen !== gen) return;
      ui.busy = false;
      ui.joinError = e.offline ? '인터넷에 연결할 수 없어요' : e.message;
      ui.adminOpen = true;
      render();
    }
  }

  const local1 = (action, msg) => { apply(action); render(); if (msg) toast(msg); };

  const HANDLERS = {
    go: (d) => { if (d.filter) ui.reviewFilter = d.filter; go(d.screen); },
    setRole: (d) => {
      if (!ALLOWED_ROLES[session.mode].includes(d.role)) return;
      apply({ type: 'setRole', role: d.role }); render(); $('screen').scrollTop = 0;
    },
    shift: (d) => {
      if (session.mode === 'admin') run(() => asAdmin('hwasun_set_date', { p_date: Store.addDays(view().today, Number(d.n)) }));
      else local1({ type: 'shiftDay', n: Number(d.n) });
    },
    reset: () => {
      ui = freshUi();
      if (session.mode === 'admin') {
        run(async () => { await asAdmin('hwasun_reset'); local = { ...Store.seed(), role: 'admin', screen: 'dashboard' }; persist(); }, '반 전체를 처음 상태로 되돌렸어요');
      } else if (session.mode === 'class') {
        toast('처음 상태로 되돌리기는 강사만 할 수 있어요');
      } else { local = Store.seed(); persist(); render(); toast('처음 상태로 되돌렸어요'); }
    },
    leave: () => leave(),
    soloMode: () => { gen += 1; resetPolling(); pin = null; remote = null; session = { mode: 'solo' }; local = Store.seed(); ui = freshUi(); persist(); render(); },
    openAdmin: () => { ui.adminOpen = true; render(); },
    joinClass: () => {
      const code = ($('join-code').value || '').trim();
      if (!/^[0-9]{4}$/.test(code)) { ui.joinError = '반 코드는 숫자 4자리예요'; ui.codeDraft = code; render(); return; }
      startClass(code);
    },
    adminLogin: () => {
      const code = ($('admin-code').value || '').trim();
      const value = ($('admin-pin').value || '').trim();
      if (!/^[0-9]{4}$/.test(code) || !/^[0-9]{6}$/.test(value)) { ui.joinError = '반 코드 4자리와 PIN 6자리를 넣어 주세요'; ui.adminOpen = true; render(); return; }
      startAdmin(code, value);
    },
    elig: (d) => { ui.elig[d.key] = d.value; render(); },
    toggleDoc: (d) => { ui.docs[d.doc] = !ui.docs[d.doc]; render(); },
    submitApp: async () => {
      const applicantType = ui.elig.household === 'newlywed' ? 'newlywed' : 'youth';
      if (session.mode === 'class') {
        if (await run(() => asMe('hwasun_submit', { p_type: applicantType, p_docs: ui.docs }), '신청서를 냈어요')) go('my');
      } else { apply({ type: 'submitApplication', docs: ui.docs, applicantType }); toast('신청서를 냈어요'); go('my'); }
    },
    resubmit: (d) => (session.mode === 'class'
      ? run(() => asMe('hwasun_resubmit', { p_doc: d.doc }), '서류를 다시 올렸어요')
      : local1({ type: 'resubmit', doc: d.doc }, '서류를 다시 올렸어요')),
    reviewFilter: (d) => { ui.reviewFilter = d.filter; render(); },
    openReview: (d) => { ui.reviewId = d.id; go('reviewDetail'); },
    requestFix: (d) => (d.id.startsWith('P')
      ? run(() => asAdmin('hwasun_request_fix', { p_id: rid(d.id), p_doc: d.doc }), '보완 요청을 보냈어요')
      : local1({ type: 'requestFix', id: d.id, doc: d.doc }, '보완 요청을 보냈어요')),
    verify: (d) => (d.id.startsWith('P')
      ? run(() => asAdmin('hwasun_verify', { p_id: rid(d.id) }), '서류 확인을 마쳤어요')
      : local1({ type: 'verify', id: d.id }, '서류 확인을 마쳤어요')),
    lottery: () => {
      if (session.mode === 'admin') run(async () => { await asAdmin('hwasun_lottery'); apply({ type: 'runLottery' }); }, '추첨 결과를 등록했어요');
      else local1({ type: 'runLottery' }, '추첨 결과를 등록했어요');
    },
    contract: () => (session.mode === 'class' ? run(() => asMe('hwasun_contract'), '계약을 마쳤어요') : local1({ type: 'signContract' }, '계약을 마쳤어요')),
    moveIn: () => (session.mode === 'class' ? run(() => asMe('hwasun_move_in'), '입주를 환영해요') : local1({ type: 'moveIn' }, '입주를 환영해요')),
    register: () => (session.mode === 'class' ? run(() => asMe('hwasun_register'), '전입신고를 확인했어요') : local1({ type: 'registerAddress' }, '전입신고를 확인했어요')),
    pickKind: (d) => { ui.repair.kind = d.kind; render(); },
    submitRepair: async () => {
      const { kind, photo } = ui.repair;
      const desc = ui.repair.desc.trim();
      if (session.mode === 'class') {
        const ok = await run(async () => {
          const res = await asMe('hwasun_repair', { p_kind: kind, p_desc: desc });
          if (photo) { photos[res.id] = photo; store.set(PHOTO_KEY, photos); }
        }, '고장을 접수했어요');
        if (!ok) return;
      } else {
        apply({ type: 'submitRepair', kind, desc, photo });
        toast('고장을 접수했어요');
      }
      ui.repair = { kind: null, desc: '', photo: null };
      go('repairStatus');
    },
    openRepair: (d) => { ui.repairId = d.id; go('repairDetail'); },
    repairNext: (d) => (d.id.startsWith('Q')
      ? run(() => asAdmin('hwasun_repair_next', { p_id: rid(d.id) }), '처리 단계를 바꿨어요')
      : local1({ type: 'repairNext', id: d.id }, '처리 단계를 바꿨어요')),
    notify: (d) => toast(d.msg),
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled || el.tagName === 'INPUT') return;
    const fn = HANDLERS[el.dataset.action];
    if (fn && allowed(el.dataset.action)) fn(el.dataset);
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'join-code' || e.target.id === 'admin-code') { ui.codeDraft = e.target.value; return; }
    if (e.target.id !== 'repair-desc') return;
    ui.repair.desc = e.target.value;
    const btn = document.querySelector('[data-action="submitRepair"]');
    if (btn) btn.disabled = !(ui.repair.kind && ui.repair.desc.trim());
  });

  document.addEventListener('change', (e) => {
    if (e.target.dataset.action !== 'pickPhoto') return;
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > MAX_PHOTO) { toast('사진은 2MB 이하로 올려 주세요'); return; }
    if (!/^image\//.test(file.type)) { toast('사진 파일만 올릴 수 있어요'); return; }
    const myGen = gen;
    const reader = new FileReader();
    reader.onload = () => { if (myGen !== gen) return; ui.repair.photo = reader.result; render(); };
    reader.readAsDataURL(file);
  });

  setInterval(() => { if (!document.hidden && Date.now() >= nextPollAt) refresh(); }, POLL_MS);
  window.addEventListener('online', () => { nextPollAt = 0; refresh(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

  render();
  refresh();
})();
</script>
</body>
</html>
